<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Tamer Science — Teacher Hub</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 30px 15px;
      color: #122b52;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .exam {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .exam h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 21px;
    }

    .exam p {
      color: #666;
      margin-bottom: 18px;
    }

    .button {
      display: inline-block;
      border: none;
      color: white;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .open {
      background: #122b52;
    }

    .open:hover {
      background: #0b1f3a;
    }

    .copy {
      background: #f47b20;
    }

    .copy:hover {
      background: #d96512;
    }

    .message {
      display: block;
      margin-top: 8px;
      color: #16803c;
      font-size: 14px;
      min-height: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Mr. Tamer Science</h1>

    <div class="subtitle">
      Teacher Exam Hub
    </div>

    <div class="exam">

      <h2>Structure of the Atom</h2>

      <p>
        Prep 1 – Unit 1 – Lesson 1
      </p>

      <a
        class="button open"
        href="./Prep1_Unit_01_Lesson_1_Structure_of_the_Atom_Part_1.html">
        Open Exam
      </a>

      <button
        class="button copy"
        onclick="copyExamLink(
          'Prep1_Unit_01_Lesson_1_Structure_of_the_Atom_Part_1.html',
          this
        )">
        Copy Student Link
      </button>

      <span class="message"></span>

    </div>

  </div>

  <script>

    function copyExamLink(fileName, button) {

      const link =
        window.location.origin +
        window.location.pathname.replace(/\/$/, '') +
        '/' +
        fileName;

      navigator.clipboard.writeText(link).then(function () {

        const message =
          button.parentElement.querySelector('.message');

        message.textContent =
          'Student link copied successfully!';

        setTimeout(function () {
          message.textContent = '';
        }, 2500);

      }).catch(function () {

        alert('Could not copy the link automatically.');

      });
    }

  </script>

</body>
</html>
