<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr. Tamer Science — Teacher Hub</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    margin:0;
    padding:25px 15px;
    color:#122b52
}

.container{
    max-width:900px;
    margin:auto
}

h1{
    text-align:center;
    margin:5px 0 8px
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px
}

.status{
    background:white;
    padding:14px 18px;
    border-radius:10px;
    margin-bottom:18px;
    color:#555;
    box-shadow:0 3px 12px rgba(0,0,0,.06)
}

.section{
    margin-top:28px
}

.section-title{
    background:#122b52;
    color:white;
    padding:12px 16px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px
}

.exam{
    background:white;
    padding:20px;
    margin-bottom:14px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08)
}

.exam h2{
    margin:0 0 8px;
    font-size:19px
}

.filename{
    color:#777;
    font-size:13px;
    word-break:break-word;
    margin-bottom:16px
}

.button{
    display:inline-block;
    border:none;
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-right:7px;
    margin-bottom:7px
}

.open{
    background:#122b52
}

.copy{
    background:#f47b20
}

.message{
    display:block;
    margin-top:4px;
    color:#16803c;
    font-size:13px;
    min-height:17px
}

.error{
    color:#b42318
}
</style>
</head>

<body>

<div class="container">

<h1>Mr. Tamer Science</h1>

<div class="subtitle">
Teacher Exam Hub
</div>

<div id="status" class="status">
Loading exams...
</div>

<div id="examList"></div>

</div>


<script>

const OWNER = "chemist-tamerabdelhakam-star";
const REPO = "Science-Exams";
const BRANCH = "main";

const PAGES_BASE =
    `https://${OWNER}.github.io/${REPO}/`;

const TREE_API =
    `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;


/* Convert filename into a nicer title */

function prettyName(name){

    return name
        .replace(/\.html$/i,"")
        .replace(/_Part_\d+$/i,"")
        .replace(/_/g," ")
        .replace(/\bPrep(\d+)\b/i,"Prep $1")
        .replace(/\bUnit_(\d+)\b/i,"Unit $1")
        .replace(/\bLesson_(\d+)\b/i,"Lesson $1");

}


/* Escape HTML safely */

function escapeHtml(text){

    return text.replace(/[&<>"']/g,function(c){

        return {
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#039;'

        }[c];

    });

}


/* Determine grade folder */

function getGrade(path){

    const match = path.match(/^(Prep-\d+)/i);

    if(match){

        return match[1];

    }

    return "Other Exams";

}


/* Sort exams */

function sortExams(a,b){

    return a.path.localeCompare(
        b.path,
        undefined,
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}


/* Load all exams from all folders */

async function loadExams(){

    const status =
        document.getElementById("status");

    const list =
        document.getElementById("examList");


    try{

        const response =
            await fetch(TREE_API,{
                headers:{
                    Accept:"application/vnd.github+json"
                }
            });


        if(!response.ok){

            throw new Error(response.status);

        }


        const data =
            await response.json();


        const exams =
            data.tree
                .filter(item =>
                    item.type === "blob" &&
                    /\.html$/i.test(item.path) &&
                    !/^index\.html$/i.test(item.path.split("/").pop())
                )
                .sort(sortExams);


        list.innerHTML = "";


        if(!exams.length){

            status.textContent =
                "No exam files found.";

            return;

        }


        status.textContent =
            `${exams.length} exam${exams.length === 1 ? "" : "s"} found.`;


        /* Group exams by grade */

        const groups = {};


        exams.forEach(function(file){

            const grade =
                getGrade(file.path);


            if(!groups[grade]){

                groups[grade] = [];

            }


            groups[grade].push(file);

        });


        /* Grade order */

        const gradeOrder = [
            "Prep-1",
            "Prep-2",
            "Prep-3",
            "Other Exams"
        ];


        gradeOrder.forEach(function(grade){

            if(!groups[grade] ||
               !groups[grade].length){

                return;

            }


            const section =
                document.createElement("div");

            section.className =
                "section";


            section.innerHTML = `
                <div class="section-title">
                    ${grade.replace("Prep-","Preparatory ")}
                </div>
            `;


            groups[grade].forEach(function(file){

                /* Convert GitHub path to Pages URL */

                const encodedPath =
                    file.path
                        .split("/")
                        .map(part =>
                            encodeURIComponent(part)
                        )
                        .join("/");


                const link =
                    PAGES_BASE + encodedPath;


                const fileName =
                    file.path.split("/").pop();


                const card =
                    document.createElement("div");

                card.className =
                    "exam";


                card.innerHTML = `

                    <h2>
                        ${escapeHtml(prettyName(fileName))}
                    </h2>

                    <div class="filename">
                        ${escapeHtml(file.path)}
                    </div>

                    <a
                        class="button open"
                        href="${link}"
                        target="_blank"
                    >
                        Open Exam
                    </a>

                    <button
                        class="button copy"
                    >
                        Copy Student Link
                    </button>

                    <span class="message"></span>

                `;


                const button =
                    card.querySelector(".copy");


                const message =
                    card.querySelector(".message");


                button.addEventListener(
                    "click",
                    async function(){

                        try{

                            await navigator.clipboard.writeText(link);


                            message.textContent =
                                "Student link copied successfully.";


                            setTimeout(function(){

                                message.textContent = "";

                            },2500);


                        }catch(error){

                            message.textContent =
                                "Copy failed. Open the exam and copy its link.";

                            message.className =
                                "message error";

                        }

                    }
                );


                section.appendChild(card);

            });


            list.appendChild(section);

        });


    }catch(error){

        status.className =
            "status error";

        status.textContent =
            "Could not load the exam list. Please check your internet connection.";

        console.error(error);

    }

}


loadExams();

</script>

</body>
</html>
