<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mr Tamer Science – Mobile Dashboard</title>
<style>
:root{
  --navy:#0b1f3a;--navy2:#16385f;--orange:#f39a24;--orange-soft:#fff4e2;
  --bg:#f5f7fa;--text:#172033;--muted:#748198;--card:#fff;--border:#e6ebf1;
  --green:#1f9d62;--yellow:#d89b00;--red:#d64545;--blue:#2878c8;
  --shadow:0 4px 16px rgba(11,31,58,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  background:var(--bg);color:var(--text);
  padding-bottom:78px;
  overscroll-behavior-y:none;
}
header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;padding:16px 16px 12px;
  box-shadow:0 4px 16px rgba(11,31,58,.2);
}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;
  background:var(--orange);color:var(--navy);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;letter-spacing:.3px;
}
.brand{font-size:17px;font-weight:800;line-height:1.2}
.sub{font-size:10.5px;opacity:.75;margin-top:2px}
.lock-badge{
  margin-left:auto;font-size:10px;font-weight:700;background:rgba(255,255,255,.14);
  padding:5px 9px;border-radius:999px;white-space:nowrap;
}
.search-wrap{position:relative}
#search{
  width:100%;padding:11px 14px 11px 38px;border-radius:11px;border:0;
  font-size:14px;background:#fff;color:var(--text);outline:none;
}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.chip-row{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);
  white-space:nowrap;cursor:pointer;
}
.chip.active{background:var(--orange);color:var(--navy);border-color:var(--orange)}

.wrap{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.hidden{display:none!important}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-card span{display:block;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.stat-card b{display:block;font-size:17px;margin-top:4px;color:var(--navy)}

.list-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:11.5px;color:var(--muted);font-weight:700}

.student-list{display:flex;flex-direction:column;gap:9px}
.s-card{
  background:var(--card);border:1px solid var(--border);border-radius:13px;
  border-left:4px solid var(--border);
  padding:12px;display:flex;align-items:center;gap:11px;cursor:pointer;
  box-shadow:0 2px 8px rgba(11,31,58,.04);
}
.s-card:active{background:#fafbfd}
.avatar{
  width:42px;height:42px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
}
.s-main{flex:1;min-width:0}
.s-name{font-weight:800;font-size:14px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.s-score-wrap{text-align:right;flex:0 0 auto}
.s-score{font-size:17px;font-weight:900;color:var(--navy)}
.s-trend{font-size:10px;font-weight:800;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}.stable{color:var(--blue)}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800;margin-top:4px}
.excellent{background:#e4f6ed;color:var(--green)}
.follow{background:#fff4d7;color:#9a7000}
.intervention{background:#fde8e8;color:var(--red)}
.noscore{background:#eef1f5;color:var(--muted)}
.empty{color:var(--muted);padding:30px 10px;text-align:center;font-size:13px}

/* Profile view */
#view-profile{background:var(--bg)}
.p-header{
  position:sticky;top:0;z-index:25;background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;padding:14px 14px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 16px rgba(11,31,58,.2);
}
.back-btn{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  border:0;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
}
.p-avatar{width:38px;height:38px;border-radius:10px;background:var(--orange);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:0 0 auto}
.p-name{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-meta{font-size:10.5px;opacity:.75;margin-top:2px}

.profile-body{padding:14px}
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 7px;text-align:center;box-shadow:var(--shadow)}
.pcard.main{background:#fff8ec;border-color:#f3d19b}
.pcard span{display:block;font-size:8.5px;color:var(--muted);font-weight:700;letter-spacing:.2px;line-height:1.3}
.pcard b{display:block;font-size:15px;margin-top:5px;color:var(--navy)}
.pcard.main b{font-size:18px}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:12px 0;box-shadow:var(--shadow)}
.chart-title{font-weight:800;font-size:12.5px;margin-bottom:6px}
.chart-card canvas{display:block;width:100%;height:210px}

.section-title{font-size:14px;font-weight:800;margin:16px 0 9px;color:var(--navy)}
.months{display:flex;flex-direction:column;gap:9px}
.month{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px;box-shadow:var(--shadow)}
.month-head{display:flex;justify-content:space-between;align-items:center}
.month-head h4{margin:0;font-size:12.5px;font-weight:800;color:var(--navy)}
.month-head b{font-size:15px;color:var(--navy)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.metric{background:#f7f9fb;border-radius:9px;padding:7px 5px;text-align:center}
.metric span{display:block;color:var(--muted);font-size:8.5px;font-weight:700}
.metric b{display:block;font-size:12px;margin-top:3px}
.weekly{margin-top:8px;padding-top:7px;border-top:1px dashed var(--border);font-size:10.5px;color:var(--muted)}

.note-box{margin-top:14px;padding:13px;border:1px solid var(--border);border-radius:13px;background:#fffaf2}
.note-box label{font-weight:800;font-size:12px;display:block;margin-bottom:7px}
.note-text{font-size:12.5px;color:var(--text);white-space:pre-wrap;line-height:1.5}
.note-empty{font-size:12px;color:var(--muted);font-style:italic}

/* Ranking */
.rank-controls{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.rank-row{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:10px 11px;margin-bottom:8px;box-shadow:0 2px 8px rgba(11,31,58,.04);cursor:pointer;
}
.rank-no{font-size:15px;font-weight:900;color:var(--navy);width:26px;flex:0 0 auto;text-align:center}
.rank-info{flex:1;min-width:0}
.rank-name{font-weight:800;font-size:13px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-group{font-size:10px;color:var(--muted)}
.rank-val{font-size:15px;font-weight:900;color:var(--navy);text-align:right}

/* Warning */
.warn-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.warn-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
.warn-stat span{display:block;font-size:9px;color:var(--muted);font-weight:700}
.warn-stat b{display:block;font-size:19px;margin-top:4px}
.warn-item{
  background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px;margin-bottom:9px;
  box-shadow:0 2px 8px rgba(11,31,58,.04);cursor:pointer;
}
.warn-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.warn-name{font-weight:800;font-size:13.5px;color:var(--navy)}
.warn-group{font-size:10px;color:var(--muted);margin-top:1px}
.warn-score{font-size:14px;font-weight:900;text-align:right}
.warn-badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:9.5px;font-weight:800;margin-top:7px}
.badge-3{background:#fde8e8;color:var(--red)}
.badge-2{background:#fff4d7;color:#9a7000}
.badge-1{background:#eef6ff;color:var(--blue)}
.warn-reasons{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}

/* Bottom nav */
nav.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:#fff;border-top:1px solid var(--border);
  display:flex;box-shadow:0 -4px 16px rgba(11,31,58,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;border:0;background:transparent;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);
}
.nav-btn .ic{font-size:19px}
.nav-btn .lb{font-size:10px;font-weight:700}
.nav-btn.active{color:var(--orange)}
.nav-btn.active .lb{color:var(--navy)}

::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>

<header id="mainHeader">
  <div class="brand-row">
    <div class="brand-mark">MTS</div>
    <div>
      <div class="brand">Mr Tamer Science</div>
      <div class="sub">Mobile Dashboard • View Only</div>
    </div>
    <div class="lock-badge">🔒 Read-only</div>
  </div>
  <div id="searchArea">
    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input id="search" placeholder="Search student by name…" autocomplete="off">
    </div>
    <div class="chip-row" id="groupChips"></div>
  </div>
</header>

<div class="wrap">

  <!-- STUDENTS LIST VIEW -->
  <section id="view-list">
    <div class="stat-grid">
      <div class="stat-card"><span>Students</span><b id="stTotal">0</b></div>
      <div class="stat-card"><span>Avg Overall</span><b id="stAvg">—</b></div>
      <div class="stat-card"><span>Excellent</span><b id="stExcellent">0</b></div>
      <div class="stat-card"><span>Needs Attn.</span><b id="stAttention">0</b></div>
    </div>
    <div class="list-meta"><span id="listCount">0 students</span></div>
    <div class="student-list" id="studentList"></div>
  </section>

  <!-- RANKING VIEW -->
  <section id="view-ranking" class="hidden">
    <div class="rank-controls">
      <div class="chip active" data-sort="overall">🏆 Overall</div>
      <div class="chip" data-sort="attendance">Attendance</div>
      <div class="chip" data-sort="homework">Homework</div>
      <div class="chip" data-sort="commitment">Commitment</div>
    </div>
    <div class="list-meta"><span id="rankLabel">Sorted by Overall</span></div>
    <div id="rankList"></div>
  </section>

  <!-- EARLY WARNING VIEW -->
  <section id="view-warning" class="hidden">
    <div class="warn-stats">
      <div class="warn-stat"><span>Intervention</span><b style="color:var(--red)" id="wIntervention">0</b></div>
      <div class="warn-stat"><span>Follow-up</span><b style="color:#9a7000" id="wFollow">0</b></div>
      <div class="warn-stat"><span>Declining</span><b style="color:var(--blue)" id="wDeclining">0</b></div>
    </div>
    <div class="list-meta"><span id="warnLabel">0 students flagged</span></div>
    <div id="warnList"></div>
  </section>

</div>

<!-- PROFILE VIEW (full screen overlay) -->
<section id="view-profile" class="hidden">
  <div class="p-header">
    <button class="back-btn" onclick="closeProfile()">‹</button>
    <div class="p-avatar" id="pAvatar">--</div>
    <div style="min-width:0">
      <div class="p-name" id="pName">—</div>
      <div class="p-meta" id="pMeta">—</div>
    </div>
  </div>
  <div class="profile-body" id="profileBody"></div>
</section>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="list"><span class="ic">👤</span><span class="lb">Students</span></button>
  <button class="nav-btn" data-tab="ranking"><span class="ic">🏆</span><span class="lb">Ranking</span></button>
  <button class="nav-btn" data-tab="warning"><span class="ic">⚠️</span><span class="lb">Warning</span></button>
</nav>

function statusValue(s){let v=avgYear(s);return v==null?'':v>=85?'Excellent':v>=70?'Needs Follow-up':'Needs Intervention'}
function trendClass(x){return x==='Improving'?'up':x==='Declining'?'down':x==='Stable'?'stable':''}
function trendArrow(x){return x==='Improving'?'↑ Improving':x==='Declining'?'↓ Declining':x==='Stable'?'→ Stable':'—'}
function latestNum(s,field){for(let i=s.months.length-1;i>=0;i--){let v=s.months[i][field];if(typeof v==='number')return v}return null}
function averageNum(s,field){const v=s.months.map(m=>m[field]).filter(x=>typeof x==='number');return v.length?round1(v.reduce((a,b)=>a+b,0)/v.length):null}
function pct(v){return v==null?'—':v+'%'}
function initials(name){return String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'ST'}

// Precompute derived fields once
DATA.students.forEach(s=>{s.yearOverall=avgYear(s);s.status=statusValue(s);s.trend=trendValue(s)});

function allGroups(){return [...new Set(DATA.students.map(s=>s.group).filter(Boolean))].sort()}

const GROUP_PALETTE=[
  {color:'#2878c8'},{color:'#8b5cf6'},{color:'#0f9f8a'},{color:'#d97706'},
  {color:'#e11d48'},{color:'#0f766e'},{color:'#7c3aed'},{color:'#b45309'}
];
function groupTheme(g){
  const groups=allGroups(), i=groups.indexOf(g);
  return GROUP_PALETTE[(i<0?0:i)%GROUP_PALETTE.length];
}

let activeGroup='';
let currentTab='list';
let rankSort='overall';
let profileFrom='list';

// ---------- Students list ----------
function setupChips(){
  const groups=allGroups();
  $('groupChips').innerHTML='<div class="chip'+(activeGroup===''?' active':'')+'" data-g="">All Groups</div>'+
    groups.map(g=>`<div class="chip${activeGroup===g?' active':''}" data-g="${esc(g)}">${esc(g)}</div>`).join('');
  $('groupChips').querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=()=>{activeGroup=ch.getAttribute('data-g');renderList()};
  });
}

function filteredStudents(){
  const q=$('search').value.trim().toLowerCase();
  return DATA.students.filter(s=>{
    if(activeGroup && s.group!==activeGroup) return false;
    if(q && !(s.name+' '+s.group).toLowerCase().includes(q)) return false;
    return true;
  });
}

function statusPillClass(status){
  return status==='Excellent'?'excellent':status==='Needs Follow-up'?'follow':status==='Needs Intervention'?'intervention':'noscore';
}

function renderList(){
  setupChips();
  const visible=filteredStudents();
  $('stTotal').textContent=visible.length;
  const vals=visible.map(s=>s.yearOverall).filter(x=>typeof x==='number');
  $('stAvg').textContent=vals.length?round1(vals.reduce((a,b)=>a+b,0)/vals.length)+'%':'—';
  $('stExcellent').textContent=visible.filter(s=>s.status==='Excellent').length;
  $('stAttention').textContent=visible.filter(s=>s.status && s.status!=='Excellent').length;
  $('listCount').textContent=visible.length+' student'+(visible.length===1?'':'s');

  $('studentList').innerHTML=visible.map(s=>{
    const i=DATA.students.indexOf(s);
    const status=s.status||'No score';
    return `<div class="s-card" style="border-left-color:${groupTheme(s.group).color}" onclick="openProfile(${i},'list')">
      <div class="avatar">${esc(initials(s.name))}</div>
      <div class="s-main">
        <div class="s-name">${esc(s.name)}</div>
        <div class="s-meta">${esc(s.group)} • ${esc(s.day)} • ${esc(s.time)}</div>
        <div class="pill ${statusPillClass(status)}">${esc(status)}</div>
      </div>
      <div class="s-score-wrap">
        <div class="s-score">${pct(s.yearOverall)}</div>
        <div class="s-trend ${trendClass(s.trend)}">${s.trend==='Improving'?'↑':s.trend==='Declining'?'↓':s.trend==='Stable'?'→':'—'}</div>
      </div>
    </div>`;
  }).join('') || '<div class="empty">No students match your search.</div>';
}

// ---------- Profile ----------
function openProfile(i,from){
  profileFrom=from||'list';
  const s=DATA.students[i];
  if(!s) return;
  $('pAvatar').textContent=initials(s.name);
  $('pName').textContent=s.name;
  $('pMeta').textContent=s.group+' • '+s.day+' • '+s.time;

  const latestAttendance=averageNum(s,'attendance');
  const latestHomework=averageNum(s,'homework');
  const latestCommitment=averageNum(s,'commitment');
  const lastScoreVal=(()=>{for(let k=s.months.length-1;k>=0;k--){if(typeof s.months[k].overall==='number')return s.months[k].overall+'%'}return '—'})();
  const recordedCount=s.months.filter(m=>m.overall!=null).length;

  const monthsHtml=s.months.map(m=>`
    <div class="month">
      <div class="month-head"><h4>${esc(m.name)}</h4><b>${pct(m.overall)}</b></div>
      <div class="metrics">
        <div class="metric"><span>Exam Avg</span><b>${pct(m.examAvg)}</b></div>
        <div class="metric"><span>Attendance</span><b>${pct(m.attendance)}</b></div>
        <div class="metric"><span>Homework</span><b>${pct(m.homework)}</b></div>
        <div class="metric"><span>Commitment</span><b>${pct(m.commitment)}</b></div>
      </div>
      <div class="weekly">Weekly scores: ${m.scores.map(x=>x==null?'—':x).join(' • ')}</div>
    </div>`).join('');

  const note=(s.note||'').trim();

  $('profileBody').innerHTML=`
    <div class="card-grid">
      <div class="pcard main"><span>Overall Average</span><b>${pct(s.yearOverall)}</b></div>
      <div class="pcard"><span>Attendance</span><b>${pct(latestAttendance)}</b></div>
      <div class="pcard"><span>Homework</span><b>${pct(latestHomework)}</b></div>
      <div class="pcard"><span>Commitment</span><b>${pct(latestCommitment)}</b></div>
    </div>
    <div class="card-grid">
      <div class="pcard"><span>Trend</span><b class="${trendClass(s.trend)}" style="font-size:12.5px">${trendArrow(s.trend)}</b></div>
      <div class="pcard"><span>Status</span><b style="font-size:11.5px">${esc(s.status||'—')}</b></div>
      <div class="pcard"><span>Months Recorded</span><b>${recordedCount}/${s.months.length}</b></div>
      <div class="pcard"><span>Last Month Score</span><b>${lastScoreVal}</b></div>
    </div>

    <div class="chart-card">
      <div class="chart-title">📈 Student Progress</div>
      <canvas id="studentChart"></canvas>
    </div>

    <div class="section-title">📋 Monthly Performance</div>
    <div class="months">${monthsHtml}</div>

    <div class="note-box">
      <label>📝 Teacher Note</label>
      ${note?`<div class="note-text">${esc(note)}</div>`:'<div class="note-empty">No note recorded for this student.</div>'}
    </div>
  `;

  $('view-list').classList.add('hidden');
  $('view-ranking').classList.add('hidden');
  $('view-warning').classList.add('hidden');
  $('mainHeader').classList.add('hidden');
  $('view-profile').classList.remove('hidden');
  document.querySelector('nav.bottom-nav').classList.add('hidden');
  window.scrollTo(0,0);

  setTimeout(()=>{
    drawLine($('studentChart'), s.months.map(m=>m.name), s.months.map(m=>m.overall));
  },0);
}
function closeProfile(){
  $('view-profile').classList.add('hidden');
  $('mainHeader').classList.remove('hidden');
  document.querySelector('nav.bottom-nav').classList.remove('hidden');
  showTab(currentTab);
  window.scrollTo(0,0);
}

// ---------- Chart ----------
function drawLine(canvas,labels,values){
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1, w=Math.max(280,canvas.clientWidth||320), h=210;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const c=canvas.getContext('2d'); c.scale(dpr,dpr); c.clearRect(0,0,w,h);
  const pad={l:34,r:12,t:16,b:34};
  c.font='10px -apple-system,Segoe UI,Arial'; c.fillStyle='#748198';
  const vals=values.filter(v=>v!=null);
  if(!vals.length){ c.fillText('No scored months yet', pad.l, 70); return; }
  const min=0,max=100;
  for(let y=0;y<=100;y+=20){
    let yy=pad.t+(100-y)/(max-min)*(h-pad.t-pad.b);
    c.strokeStyle='#e9edf3'; c.beginPath(); c.moveTo(pad.l,yy); c.lineTo(w-pad.r,yy); c.stroke();
    c.fillText(y+'%',4,yy+3);
  }
  const pts=[];
  values.forEach((v,i)=>{
    if(v==null) return;
    let x=labels.length===1?pad.l:(pad.l+i*(w-pad.l-pad.r)/(labels.length-1));
    let y=pad.t+(100-v)/(max-min)*(h-pad.t-pad.b);
    pts.push([x,y,v]);
  });
  if(pts.length>1){
    c.strokeStyle='#f39a24'; c.lineWidth=2.5; c.beginPath();
    pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.stroke();
  }
  pts.forEach(p=>{
    c.fillStyle='#0b1f3a'; c.beginPath(); c.arc(p[0],p[1],3.2,0,Math.PI*2); c.fill();
  });
  c.fillStyle='#748198'; c.font='9px -apple-system,Segoe UI,Arial';
  labels.forEach((lab,i)=>{
    let x=labels.length===1?pad.l:pad.l+i*(w-pad.l-pad.r)/(labels.length-1);
    c.save(); c.translate(x,h-6); c.rotate(-0.5);
    c.fillText(lab.replace(' 2026','').replace(' 2027',''),0,0);
    c.restore();
  });
}

// ---------- Ranking ----------
function rankingMetric(s,field){
  if(field==='overall') return s.yearOverall;
  return latestNum(s,field);
}
function renderRanking(){
  const visible=DATA.students;
  const ranked=[...visible].filter(s=>rankingMetric(s,rankSort)!=null).sort((a,b)=>rankingMetric(b,rankSort)-rankingMetric(a,rankSort));
  const labelMap={overall:'Overall',attendance:'Attendance',homework:'Homework',commitment:'Commitment'};
  $('rankLabel').textContent=ranked.length+' students • sorted by '+labelMap[rankSort];
  $('rankList').innerHTML=ranked.map((s,n)=>{
    const i=DATA.students.indexOf(s);
    const medal=n===0?'🥇':n===1?'🥈':n===2?'🥉':(n+1);
    const val=rankingMetric(s,rankSort);
    return `<div class="rank-row" onclick="openProfile(${i},'ranking')">
      <div class="rank-no">${medal}</div>
      <div class="rank-info">
        <div class="rank-name">${esc(s.name)}</div>
        <div class="rank-group">${esc(s.group)}</div>
      </div>
      <div class="rank-val">${pct(val)}</div>
    </div>`;
  }).join('') || '<div class="empty">No scored students yet.</div>';
}

// ---------- Early Warning ----------
function warningInfo(s){
  const reasons=[];
  const st=s.status, tr=s.trend;
  const a=latestNum(s,'attendance'), h=latestNum(s,'homework'), c=latestNum(s,'commitment');
  if(st==='Needs Intervention') reasons.push('Overall below 70%');
  else if(st==='Needs Follow-up') reasons.push('Overall below 85%');
  if(typeof a==='number' && a<80) reasons.push('Attendance '+a+'%');
  if(typeof h==='number' && h<80) reasons.push('Homework '+h+'%');
  if(typeof c==='number' && c<80) reasons.push('Commitment '+c+'%');
  if(tr==='Declining') reasons.push('Declining trend');
  const priority=st==='Needs Intervention'?3:(tr==='Declining'||st==='Needs Follow-up'||reasons.length>=2?2:(reasons.length?1:0));
  return {reasons,priority,overall:s.yearOverall};
}
function renderWarning(){
  const visible=DATA.students;
  const items=visible.map(s=>({s,info:warningInfo(s)})).filter(x=>x.info.priority>0)
    .sort((a,b)=>b.info.priority-a.info.priority || (a.info.overall??101)-(b.info.overall??101));
  $('wIntervention').textContent=visible.filter(s=>s.status==='Needs Intervention').length;
  $('wFollow').textContent=visible.filter(s=>s.status==='Needs Follow-up').length;
  $('wDeclining').textContent=visible.filter(s=>s.trend==='Declining').length;
  $('warnLabel').textContent=items.length+' student'+(items.length===1?'':'s')+' flagged';
  $('warnList').innerHTML=items.map(x=>{
    const s=x.s, i=DATA.students.indexOf(s), info=x.info;
    const badgeText=info.priority===3?'Needs Intervention':info.priority===2?'Needs Follow-up':'Monitor';
    return `<div class="warn-item" onclick="openProfile(${i},'warning')">
      <div class="warn-top">
        <div><div class="warn-name">${esc(s.name)}</div><div class="warn-group">${esc(s.group)}</div></div>
        <div class="warn-score ${trendClass(s.trend)}">${pct(info.overall)}</div>
      </div>
      <div class="warn-badge badge-${info.priority}">${badgeText}</div>
      <div class="warn-reasons">${esc(info.reasons.join(' • '))}</div>
    </div>`;
  }).join('') || '<div class="empty">No early-warning students. 👍</div>';
}

// ---------- Tabs ----------
function showTab(tab){
  currentTab=tab;
  $('view-list').classList.toggle('hidden', tab!=='list');
  $('view-ranking').classList.toggle('hidden', tab!=='ranking');
  $('view-warning').classList.toggle('hidden', tab!=='warning');
  $('searchArea').classList.toggle('hidden', tab!=='list');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab')===tab));
  if(tab==='list') renderList();
  if(tab==='ranking') renderRanking();
  if(tab==='warning') renderWarning();
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>showTab(b.getAttribute('data-tab')));
document.querySelectorAll('.rank-controls .chip').forEach(ch=>{
  ch.onclick=()=>{
    document.querySelectorAll('.rank-controls .chip').forEach(c=>c.classList.remove('active'));
    ch.classList.add('active');
    rankSort=ch.getAttribute('data-sort');
    renderRanking();
  };
});
$('search').addEventListener('input', renderList);

showTab('list');
</script>
