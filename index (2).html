<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr. Tamer Science — Teacher Hub</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 25px 15px;
      color: #122b52;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 5px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .status {
      background: white;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 18px;
      color: #555;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .exam {
      background: white;
      padding: 20px;
      margin-bottom: 14px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .exam h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .path {
      color: #777;
      font-size: 13px;
      word-break: break-word;
      margin: 7px 0 16px;
    }

    .button {
      display: inline-block;
      border: none;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 7px;
      margin-bottom: 7px;
    }

    .open {
      background: #122b52;
    }

    .copy {
      background: #f47b20;
    }

    .message {
      display: block;
      margin-top: 4px;
      color: #16803c;
      font-size: 13px;
      min-height: 17px;
    }

    .error {
      color: #b42318;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Mr. Tamer Science</h1>

    <div class="subtitle">
      Teacher Exam Hub
    </div>

    <div id="status" class="status">
      Loading all exams...
    </div>

    <div id="examList"></div>

  </div>

  <script>

    const OWNER = "chemist-tamerabdelhakam-star";
    const REPO = "Science-Exams";
    const BRANCH = "main";

    const PAGES_BASE =
      "https://" + OWNER + ".github.io/" + REPO + "/";

    const API_BASE =
      "https://api.github.com/repos/" +
      OWNER + "/" + REPO + "/contents/";

    function encodePath(path) {
      return path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
    }

    async function getFolderContents(path = "") {

      const url =
        API_BASE +
        encodePath(path) +
        "?ref=" +
        encodeURIComponent(BRANCH);

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          "GitHub API returned " + response.status
        );
      }

      return await response.json();
    }

    async function getAllHtmlFiles(path = "") {

      const items =
        await getFolderContents(path);

      let results = [];

      for (const item of items) {

        /* Find HTML exam files */

        if (
          item.type === "file" &&
          /\.html$/i.test(item.name) &&
          item.name.toLowerCase() !== "index.html"
        ) {

          results.push({
            name: item.name,
            path: item.path
          });
        }

        /* Enter every folder */

        if (item.type === "dir") {

          const nested =
            await getAllHtmlFiles(item.path);

          results =
            results.concat(nested);
        }
      }

      return results;
    }

    function studentLink(filePath) {

      return (
        PAGES_BASE +
        encodePath(filePath)
      );
    }

    function prettyName(filePath) {

      const fileName =
        filePath
          .split("/")
          .pop()
          .replace(/\.html$/i, "");

      return fileName
        .replace(/_Part_\d+$/i, "")
        .replace(/_/g, " ")
        .replace(
          /\bPrep(\d+)\b/i,
          "Prep $1"
        )
        .replace(
          /\bUnit_(\d+)\b/i,
          "Unit $1"
        )
        .replace(
          /\bLesson_(\d+)\b/i,
          "Lesson $1"
        );
    }

    function sortKey(path) {

      const match =
        path.match(
          /Prep[_-]?(\d+).*?Unit[_-]?(\d+).*?Lesson[_-]?(\d+)/i
        );

      if (!match) {
        return "999999" + path;
      }

      return (
        String(match[1]).padStart(3, "0") +
        String(match[2]).padStart(3, "0") +
        String(match[3]).padStart(3, "0") +
        path
      );
    }

    function escapeHtml(text) {

      return text.replace(
        /[&<>"']/g,
        function(char) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[char];

        }
      );
    }

    async function loadExams() {

      const status =
        document.getElementById("status");

      const list =
        document.getElementById("examList");

      try {

        const exams =
          await getAllHtmlFiles();

        exams.sort(
          (a, b) =>
            sortKey(a.path)
              .localeCompare(sortKey(b.path))
        );

        list.innerHTML = "";

        if (exams.length === 0) {

          status.textContent =
            "No exam files found.";

          return;
        }

        status.textContent =
          exams.length +
          " exam" +
          (exams.length === 1 ? "" : "s") +
          " found.";

        exams.forEach(exam => {

          const link =
            studentLink(exam.path);

          const card =
            document.createElement("div");

          card.className = "exam";

          card.innerHTML = `
            <h2>
              ${escapeHtml(
                prettyName(exam.path)
              )}
            </h2>

            <div class="path">
              ${escapeHtml(exam.path)}
            </div>

            <a
              class="button open"
              href="${link}">
              Open Exam
            </a>

            <button
              class="button copy">
              Copy Student Link
            </button>

            <span class="message"></span>
          `;

          const button =
            card.querySelector(".copy");

          const message =
            card.querySelector(".message");

          button.addEventListener(
            "click",
            async function() {

              try {

                await navigator.clipboard
                  .writeText(link);

                message.textContent =
                  "Student link copied successfully.";

                setTimeout(
                  () => {
                    message.textContent = "";
                  },
                  2500
                );

              } catch {

                message.className =
                  "message error";

                message.textContent =
                  "Copy failed. Use Open Exam and copy its address.";
              }

            }
          );

          list.appendChild(card);

        });

      } catch (error) {

        status.className =
          "status error";

        status.textContent =
          "Could not load the exams. Check your internet connection and GitHub Pages.";

        console.error(error);
      }
    }

    loadExams();

  </script>

</body>
</html>
